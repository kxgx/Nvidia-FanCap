# Nvidia-FanCap settings - edit by hand or use the GUI (double click the exe).
# The daemon re-reads this file within ~5 seconds of a change.
#
# cap            fan ceiling in percent (anything above is forced back down)
# mode           cap = ceiling only, fixed = constant speed at cap, curve = temperature curves
# interval       fastest poll period in ms while policing the fan
# preempt        take control at this temperature (0 = reactive only)
# release        hand control back to the driver below this temperature
# valve          safety valve temperature (release the ceiling to protect the card)
# valve_reenable re-arm the ceiling below this temperature
# valve_enabled  1 = safety valve on (recommended), 0 = off
# power_limit    GPU power limit in watts applied at start (0 = unchanged)
#                in curve mode: hard upper bound for the power curve
# fan            which fan to control, -1 = automatic
#
# auto mode (mode=auto) --------------------------------------------------
# the program learns the thermal response (T = A + B*power + C*fan) from steady
# states and derives the fan curve from the power limit above; the only inputs
# are power_limit and target_temp (the learning result is kept in
# %LOCALAPPDATA%\Nvidia-FanCap\model.txt)
#target_temp=78
#
# curve mode (mode=curve) ------------------------------------------------
# curve_temp / curve_fan             temperature -> fan percent knots (C, %)
# power_curve_temp / power_curve_watt  temperature -> power limit knots (C, W)
# temp_ema        temperature smoothing 0..1 (lower = smoother, slower)
# fan_rate_up / fan_rate_down          max fan change per tick (percent)
# defaults are used when these keys are absent; the GUI checkbox toggles the mode
#curve_temp=35,50,55,62,70,76,80,83,86,90
#curve_fan=0,0,24,30,37,43,49,58,72,100
#power_curve_temp=60,70,76,80,83,86,90
#power_curve_watt=310,255,205,170,140,120,100
#temp_ema=0.25
#fan_rate_up=2.0
#fan_rate_down=1.0
cap=40
mode=cap
interval=250
preempt=75
release=45
valve=90
valve_reenable=84
valve_enabled=1
power_limit=0
fan=-1
