name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
    # 纯 .md 文档变更不触发构建（paths-ignore 对 tag 推送不生效，发布流程不受影响）
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

# 同一分支/PR 的新提交取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：默认只读，发布 job 单独开 write
permissions:
  contents: read

jobs:

  checks:
    runs-on: ubuntu-24.04
    # 供编译按需跳过：仅 .md/工作流等非代码变更时输出 code=false
    outputs:
      code: ${{ steps.codechange.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 0. 检测代码变更（非代码变更时编译按需跳过）
        id: codechange
        run: |
          # 按事件取基线：PR 对比目标分支，push 对比推送前的提交
          # （push 到 main 时若对比 origin/main...HEAD 会永远判为“无变更”，编译会被跳过）
          EVENT="${{ github.event_name }}"
          SHOULD=true
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch --no-tags origin "$BASE" 2>/dev/null || true
            if git rev-parse --verify "origin/$BASE" >/dev/null 2>&1; then
              if ! git diff --name-only "origin/$BASE...HEAD" -- . \
                ':(exclude)*.md' ':(exclude)**/*.md' ':(exclude).github/**' \
                ':(exclude).gitignore' ':(exclude)LICENSE' | grep -q .; then SHOULD=false; fi
            fi
          elif [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
               && git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
              if ! git diff --name-only "$BASE" HEAD -- . \
                ':(exclude)*.md' ':(exclude)**/*.md' ':(exclude).github/**' \
                ':(exclude).gitignore' ':(exclude)LICENSE' | grep -q .; then SHOULD=false; fi
            fi
          fi
          echo "code=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "检测结果: code=$SHOULD"
      - name: 1. 检查仓库中没有构建脚本（构建统一由本工作流完成）
        run: |
          if find . -path ./.git -prune -o \( -name '*.bat' -o -name '*.cmd' \) -print | grep -q .; then
            echo "::error::仓库中不应包含 bat/cmd 构建脚本，构建由 CI 完成"
            find . -path ./.git -prune -o \( -name '*.bat' -o -name '*.cmd' \) -print
            exit 1
          fi
          echo "OK: 仓库中没有 bat/cmd 脚本"
      - name: 2. 检查 MSI 版本号与 Product.wxs 一致
        run: |
          VER=$(grep -oP 'Version="\K[0-9]+\.[0-9]+\.[0-9]+' Product.wxs | head -1)
          if [ -z "$VER" ]; then echo "::error::Product.wxs 中找不到版本号"; exit 1; fi
          echo "MSI 版本: $VER"

  win-x64:
    name: Windows x64
    needs: [checks]
    if: needs.checks.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 编译（NativeAOT 单文件原生程序）
        run: dotnet publish Nvidia-FanCap.csproj -c Release -o dist
      - name: 安装 WiX 并构建 MSI
        shell: pwsh
        run: |
          # WiX v7：EULA 接受标记（OSMF 费用仅对年收入 >1 万美元的组织生效，
          # 本项目为非盈利开源项目，接受标记后无额外义务）
          dotnet tool install --tool-path .tools wix --version 7.0.1
          # -CaseSensitive 必须加：否则会匹配到 XML 声明里的 version="1.0"
          $ver = (Select-String -Path Product.wxs -Pattern 'Version="([\d.]+)"' -CaseSensitive |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          & .tools\wix.exe build -acceptEula wix7 -arch x64 -pdbtype none Product.wxs -o "dist/Nvidia-FanCap-$ver-x64.msi"
          Write-Output "MSI 版本: $ver"
      - name: 打包绿色版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Nvidia-FanCap-x64.exe, dist/Nvidia-FanCap.ini, task.xml `
            -DestinationPath dist/Nvidia-FanCap-win-x64.zip
      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: Nvidia-FanCap-win-x64
          path: dist/

  release:
    name: 发布
    needs: [win-x64]
    # 发布门禁：仅官方仓库的 tag 触发，PR/master push 一律不发布（防误发布）
    if: github.repository == 'kxgx/Nvidia-FanCap' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: Nvidia-FanCap-**
          merge-multiple: true
      - name: 列出构件
        run: ls -la
      - name: 生成校验和与变更摘要
        run: |
          echo "Build: ${{ github.ref_name }}" > sums.txt
          sha256sum Nvidia-FanCap-* >> sums.txt
          CHANGES=$(git log --abbrev=8 --abbrev-commit --pretty=format:" - %s(%h) by %an" -15)
          { echo "## 最近变更:"; echo "$CHANGES"; } > changelog.txt
      - name: 清理同一标签下的旧资产（避免改版重发时残留过期文件名）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null |
          while read -r a; do
            [ -n "$a" ] && gh release delete-asset "$GITHUB_REF_NAME" "$a" --repo "$GITHUB_REPOSITORY" --yes || true
          done
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Nvidia-FanCap-*
            sums.txt
            changelog.txt
          draft: false
          prerelease: false
          make_latest: true
